[project]
name = "rag-homework-movies"
version = "0.1.0"
description = "RAG pipeline on Wikipedia Movie Plots"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "scikit-learn",
    "scipy",
    "pytest",
    "langchain-text-splitters",
    "pandas",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[tool.uv]
managed = true
